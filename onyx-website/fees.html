<body>
<header><div class="wrap nav">

<section><div class="wrap split" style="align-items:start"><div><div class="label">Fee calculator</div><h2>Plan your session</h2>
<form onsubmit="return false">
<label for="pkg">Package</label><select id="pkg"><option value="standard">Standard Access (R120/h)</option><option value="ultimate">Ultimate Gamer Pass (R250/h)</option><option value="vip" selected>VIP Gaming Experience (R500/h)</option></select>
<label for="hours">Duration (hours)</label><input id="hours" type="number" min="1" max="12" value="3"><small id="minNote" style="color:#a77ad6"></small>
<div class="check"><input type="checkbox" id="food"><label for="food" style="margin:0">Food &amp; drinks (+R250)</label></div>
<div class="check"><input type="checkbox" id="assistant"><label for="assistant" style="margin:0">Personal gaming assistant (+R300)</label></div></form></div>
<div class="total"><h3>Fee breakdown</h3><br>
<div class="row"><span>Package</span><span id="rBase"></span></div>
<div class="row"><span>Food &amp; drinks</span><span id="rFood"></span></div>
<div class="row"><span>Assistant</span><span id="rAsst"></span></div>
<div class="row sum"><span>Total</span><span id="rTotal"></span></div><br>
<a class="btn" href="contact.html" style="width:100%;text-align:center">Proceed to Booking</a></div></div></section>
